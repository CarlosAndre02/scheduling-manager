name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token can write to almost everything in the repository. This is
# the floor every job starts from; the one job that needs more raises it for
# itself, so a pull request cannot reach AWS through any of the others.
#
# Actions are pinned by commit SHA rather than by tag, because a tag can be
# repointed by whoever owns the action and one of these jobs holds credentials.
# The trailing comment is the version that SHA belongs to, and Dependabot keeps
# both in step.
permissions:
  contents: read

# A newer push makes the previous run's answer irrelevant before it finishes —
# but only while a run is purely an answer. On main it publishes an image and
# moves a schema, and cancelling that halfway leaves a release half made, so
# runs there queue instead of replacing each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Types, lint, format, advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Reads engines.node from package.json, so the version used here
          # cannot drift from the one the project pins.
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit
      - run: npm run lint:check
      - run: npm run prettier:check

      # Only what ships, and only what is worth blocking a merge over. An
      # advisory published against a dependency nobody touched would otherwise
      # fail an unrelated change, and a pipeline that fails for unrelated
      # reasons stops being read.
      - run: npm audit --omit=dev --audit-level=high

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # docker-compose and the application read the same file, so this also
      # fails when a new variable is added without reaching .env.example.
      - run: cp .env.example .env

      # The developer's own command, deliberately. A service container here
      # would be a second definition of the database to drift from the compose
      # file, against the parity this project is built around.
      - run: npm test

  dockerfile:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
          # Info-level findings are advice about layer count, which applies to
          # the published image. Our extra layers live in the build stage, and
          # that stage is discarded — following the rule there would be
          # cargo-culting it past its own rationale.
          failure-threshold: warning

  image:
    name: Image build, scan and tests
    # arm64, because the instance this image is deployed to is Graviton. An
    # x86 runner produces an x86 image that Docker will happily push, pull and
    # start on arm64 — and the container dies in milliseconds with an exec
    # format error, leaving the proxy with no backend and a bare 404 as the
    # only symptom. Free for public repositories, and native rather than
    # emulated, so nothing is slower than it was.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # Tagged by commit, so the scan and the tests below examine the exact
      # image a deploy would ship rather than a rebuild of it.
      - run: docker build -t scheduling-manager:${{ github.sha }} .

      # `npm audit` sees npm packages. The image is also a Debian install whose
      # CVEs are invisible to it, which is the gap this closes.
      #
      # ignore-unfixed is what keeps the job usable: every base image carries
      # advisories with no fix released, and a job that is permanently red gets
      # switched off. What remains is fixable, and for the base layer the fix
      # is a rebuild — this job builds fresh every run, so it self-heals.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scheduling-manager:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The check that would have caught the architecture mismatch above.
      # Nothing else in the pipeline notices: the build succeeds, the scan
      # succeeds, the push succeeds, and the failure surfaces only as a
      # container that will not start on the host.
      - name: Assert the image matches the deployment architecture
        run: |
          got=$(docker image inspect --format '{{.Architecture}}' "scheduling-manager:${{ github.sha }}")
          if [ "$got" != "arm64" ]; then
            echo "Image is $got but the instance is arm64 — it would not start." >&2
            exit 1
          fi
          echo "Image architecture: $got"

      - run: npx jest --config jest.image.config.js --runInBand
        env:
          IMAGE_TAG: scheduling-manager:${{ github.sha }}

      # Hand the publish job the exact bytes that were just scanned and tested.
      # Rebuilding there would publish an image no gate in this pipeline ever
      # examined — a different base digest or a different layer order is enough
      # to make the scan result untrue of what shipped.
      #
      # Already gzipped, so the upload does not compress it a second time.
      - name: Export the tested image
        if: github.ref == 'refs/heads/main'
        run: docker save scheduling-manager:${{ github.sha }} | gzip > image.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main'
        with:
          name: image
          path: image.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish to ECR
    runs-on: ubuntu-latest

    # Every gate, not just the image one: an image built from a commit that
    # fails lint or the integration suite is not one to keep.
    needs: [quality, test, dockerfile, image]
    if: github.ref == 'refs/heads/main'

    # id-token sits here rather than at the top of the file. Job permissions
    # replace the workflow's, so only this job can ask GitHub for a token; the
    # other four keep contents:read and cannot reach AWS at all.
    permissions:
      contents: read
      id-token: write

    env:
      REPOSITORY: scheduling-manager
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image

      - run: docker load < image.tar.gz

      # No stored credential. The workflow presents a short-lived signed token
      # describing this repository, branch and event, and STS exchanges it for
      # credentials that expire within the hour — docs/ci-cd.md.
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      # Tags in the registry are immutable, so pushing an existing one fails.
      # Re-running a workflow on an already-published commit is a normal thing
      # to do, and it should be a no-op rather than a red build.
      - name: Push, unless this commit is already published
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          if aws ecr describe-images \
              --repository-name "$REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "$REPOSITORY:$IMAGE_TAG is already published — nothing to do."
            exit 0
          fi

          docker tag "$REPOSITORY:$IMAGE_TAG" "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

  migrate:
    name: Apply migrations
    # Runs the image, so it needs the architecture the image was built for.
    # The publish job only moves bytes and does not, which is why it stays on
    # the default runner.
    runs-on: ubuntu-24.04-arm

    # After the artifact exists, before anything serves the new code. A release
    # with no published image has nothing to deploy, so moving the schema for it
    # would be a change with no release behind it.
    needs: [publish]
    if: github.ref == 'refs/heads/main'

    # No AWS access: this job reaches the database directly and never the
    # account, so it holds database credentials and the publish job holds the
    # AWS token, and neither sees the other's.
    permissions:
      contents: read

    env:
      REPOSITORY: scheduling-manager
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image

      # The same bytes the gates examined. Running the migration from the image
      # being released is what keeps the SQL and the code that expects it from
      # drifting apart.
      - run: docker load < image.tar.gz

      # The CA already travels in the image, so there is nothing to fetch, mount
      # or keep in a secret — the same file the application on the host verifies
      # against is the one this container uses. certs/README.md covers why it is
      # public material and belongs in git.
      #
      # DATABASE_URL carries no sslmode: pg lets a connection string replace the
      # ssl option wholesale, which would discard the CA below. TLS is
      # configured entirely by DATABASE_SSL_CA — see docs/supabase.md.
      #
      # The statement timeout is disabled for this run only. The application
      # sets one so a stuck query cannot hold a connection, and DDL against a
      # populated table can legitimately take longer than any request should.
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm \
            --env DATABASE_URL \
            --env DATABASE_SSL_CA=/app/certs/supabase-ca.pem \
            --env DATABASE_STATEMENT_TIMEOUT_MS=0 \
            "$REPOSITORY:$IMAGE_TAG" \
            node dist/shared/database/migrate.js
