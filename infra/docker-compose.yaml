services:
  database:
    container_name: postgres-dev
    image: postgres:17-alpine
    restart: always
    env_file:
      - ../.env
    ports:
      - 5432:5432
    healthcheck:
      # $$ escapes to a literal $, so the shell inside the container expands
      # these from the env_file above. Hardcoding a role means the check breaks
      # silently the day POSTGRES_USER changes.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      # First boot runs initdb before accepting connections. Without this grace
      # period the retries are spent while Postgres is still initialising, and
      # `up --wait` gives up on a volume it has never seen.
      start_period: 15s
    volumes:
      - pg_data:/var/lib/postgresql/data
volumes:
  pg_data:
    driver: local
